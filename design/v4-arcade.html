<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>V4 · NEON 霓虹 — switch-ime-term 重设计</title>
<link rel="stylesheet" href="mock.css">
<style>
/* ============================================================
   V4 NEON · 现有方向的精修：圆角键帽浮起 + 分色发光 + 候选条浮层
   左青 / 右品红；白块改成"发光键帽"，吸附那一下有物理感
   ============================================================ */
:root{
  --bg:#07070c; --panel:#0b0b14; --term:#06060b;
  --ink:#e8eaf4; --mid:#8b90a8; --faint:#3d4056; --rule:#1b1b2c;
  --l:#2ee6c8; --r:#ff4d8d; --num:#ffd166;
}
body{background:#030305;color:var(--ink)}
.screen{background:var(--bg)}

/* ---------- 顶栏 ---------- */
.top{height:32px;flex:0 0 32px;display:flex;align-items:center;padding:0 14px;gap:14px;
  border-bottom:1px solid var(--rule);font-size:11px;background:rgba(9,9,16,.9)}
.brand{font-weight:700;letter-spacing:.2em;color:var(--l);text-shadow:0 0 12px rgba(46,230,200,.45)}
.tabs{display:flex;gap:4px}
.tab{padding:3px 11px;border:1px solid transparent;border-radius:99px;font-size:10.5px;
  color:var(--mid);cursor:pointer;max-width:118px;white-space:nowrap;overflow:hidden}
.tab.on{color:var(--l);border-color:rgba(46,230,200,.35);background:rgba(46,230,200,.07)}
.tab.plus{color:var(--faint)}
.spacer{flex:1}
.top .clock{color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:.06em}
.top .bat{color:var(--l);letter-spacing:.1em;font-size:10.5px}

/* ---------- 三分区 ---------- */
.main{flex:1;display:flex;min-height:0}
.panel{width:220px;flex:0 0 220px;display:flex;flex-direction:column;background:var(--panel);
  position:relative}
.panel[data-side="left"]{border-right:1px solid var(--rule)}
.panel[data-side="right"]{border-left:1px solid var(--rule)}
/* 点阵底纹：让"滑窗"有空间感 */
.panel::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(var(--faint) .6px,transparent .7px);
  background-size:9px 9px;mask-image:linear-gradient(180deg,transparent,#000 22%,#000 78%,transparent)}
/* 活跃侧：内缘发光 */
.panel.active{box-shadow:inset 1px 0 18px -6px rgba(46,230,200,.55)}
.panel[data-side="right"].active{box-shadow:inset -1px 0 18px -6px rgba(255,77,141,.55)}

.phead{display:flex;align-items:center;gap:8px;padding:10px 13px 0;font-size:9px;
  letter-spacing:.24em;color:var(--mid)}
.phead::after{content:"";flex:1;height:1px;background:var(--rule)}
.phead .name{color:var(--ink)}
.phead .dot{width:4px;height:4px;background:var(--faint)}
.panel.active .phead .dot{background:var(--l);box-shadow:0 0 8px var(--l)}
.panel[data-side="right"].active .phead .dot{background:var(--r);box-shadow:0 0 8px var(--r)}

.shoulders{display:flex;gap:6px;padding:8px 13px 0}
.sh{display:flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;
  background:rgba(46,230,200,.06);border:1px solid rgba(46,230,200,.28);color:var(--mid);
  font:inherit;font-size:10px;cursor:pointer}
.sh b{font-weight:700;color:var(--l)}
.panel[data-side="right"] .sh{background:rgba(255,77,141,.06);border-color:rgba(255,77,141,.28)}
.panel[data-side="right"] .sh b{color:var(--r)}
.sh:active{background:rgba(46,230,200,.16)}

/* 键窗 */
.pad{display:grid;grid-template-columns:repeat(3,var(--k,64px));grid-auto-rows:var(--k,64px);
  column-gap:12px;row-gap:18px;justify-content:center;margin:34px auto 0;flex:0 0 auto}
.key{position:relative;width:var(--k,64px);height:var(--k,64px);display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:0;cursor:pointer;border-radius:14px;
  background:linear-gradient(180deg,#191c29,#0f1119);border:1px solid #262a3e;color:var(--ink);
  font:700 33px/1 'Maple Mono NF CN','JetBrains Mono',monospace;
  opacity:calc(.14 + .86*var(--fade,1));transform:scale(var(--shrink,1));
  transition:opacity .12s linear,transform .16s cubic-bezier(.2,.9,.3,1.3),
             box-shadow .16s,border-color .1s;
  box-shadow:0 4px 10px -4px #000, inset 0 1px 0 rgba(255,255,255,.06)}
.key .s{font:400 16px/1 'Maple Mono NF CN','JetBrains Mono',monospace;color:var(--mid);margin-top:1px}
.key.snap{background:linear-gradient(180deg,#5cf3dc,#17b9a0);border-color:#8dfdf0;color:#04211c;
  box-shadow:0 0 22px rgba(46,230,200,.5), 0 6px 14px -6px #000}
.key.snap .s{color:#0a4a41}
.pad[data-hand="right"] .key.snap{background:linear-gradient(180deg,#ff7aab,#e02c6f);
  border-color:#ffb3ce;color:#220510;box-shadow:0 0 22px rgba(255,77,141,.5),0 6px 14px -6px #000}
.pad[data-hand="right"] .key.snap .s{color:#5a0b2a}
.key.hover{border-color:var(--l);box-shadow:0 0 14px -2px rgba(46,230,200,.4)}
.pad[data-hand="right"] .key.hover{border-color:var(--r);box-shadow:0 0 14px -2px rgba(255,77,141,.4)}
.key:active{transform:scale(.96)}
.screen.nograb .key{opacity:calc(.5 + .5*var(--fade,1))}

/* 按钮簇 */
.cluster{margin-top:auto;border-top:1px solid var(--rule);padding:14px 13px 0}
.ptitle{font-size:9px;letter-spacing:.24em;color:var(--mid);margin-bottom:8px;
  display:flex;align-items:center;gap:8px}
.ptitle::after{content:"";flex:1;height:1px;background:var(--rule)}
.dpad,.abxy{display:grid;grid-template-columns:repeat(3,40px);grid-auto-rows:28px;gap:4px;
  justify-content:center;font-size:10px;color:var(--mid)}
.dpad button,.abxy button{background:linear-gradient(180deg,#151824,#0e1018);border:1px solid #22263a;
  border-radius:8px;font:inherit;font-size:10px;color:inherit;cursor:pointer;padding:0;
  display:grid;place-items:center}
.dpad button.on{background:var(--num);border-color:var(--num);color:#231a02;
  box-shadow:0 0 14px rgba(255,209,102,.4)}
.abxy{font-size:15px;font-weight:700}
.abxy button{font-size:14px;font-weight:700}
.abxy .a{color:#5ee89b} .abxy .b{color:var(--r)} .abxy .x{color:#6ab6ff} .abxy .y{color:var(--num)}
.hints{margin-top:14px;padding:0 13px 14px;display:flex;flex-direction:column;gap:3px;
  font-size:10px;color:var(--faint);line-height:1.5}
.hints b{font-weight:400;color:var(--mid);display:inline-block;min-width:22px}
.screen.ctrled [data-act="ctrl"],.screen.alted [data-act="alt"]{color:var(--num);border-color:#5a4620}
.screen.shifted [data-act="shift"]{color:var(--num);border-color:#5a4620}
.screen.tabwin .tab.on{box-shadow:0 0 14px rgba(46,230,200,.4)}

/* ---------- 终端 ---------- */
.term{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--term);
  padding:12px 16px 0}
.lines{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-start;
  font-size:12.5px;line-height:1.72;color:var(--mid);white-space:pre;overflow:hidden}
.lines .who{color:var(--l)} .lines .pth{color:#7fa4e8} .lines .sig{color:var(--faint)}
.lines .cmd{color:var(--ink)}
.composer{padding:6px 0 8px}
.inrow{font-size:12.5px;line-height:1.72;white-space:pre;display:flex;flex-wrap:wrap;
  align-items:baseline;color:var(--ink)}
.cmp{color:var(--l);box-shadow:inset 0 -1px 0 rgba(46,230,200,.7)}
.caret{display:inline-block;width:7px;height:15px;background:var(--l);margin:0 1px;
  transform:translateY(2px);animation:blink 1.1s steps(1) infinite;
  box-shadow:0 0 10px rgba(46,230,200,.7)}
@keyframes blink{50%{opacity:0}}
/* 候选条 = 浮层 */
.crow{position:relative;display:flex;align-items:stretch;min-height:26px;font-size:12.5px;
  background:#0a0a14;border:1px solid var(--rule);padding:3px 10px;margin-top:2px}
.crow::before,.crow::after{position:absolute;font-size:7px;color:var(--faint);line-height:1}
.crow::before{content:"◤";top:1px;left:2px} .crow::after{content:"◢";bottom:1px;right:2px}
.cands{display:flex;flex-wrap:wrap;align-items:stretch;gap:0 2px}
.cand{display:flex;align-items:baseline;gap:6px;padding:2px 9px;cursor:pointer;border-radius:5px}
.ci{font-size:9px;color:var(--faint);transform:translateY(-2px)}
.ct{color:var(--ink)}
.cp{font-size:10px;color:var(--faint);font-style:italic}
.cand.on{background:linear-gradient(90deg,rgba(46,230,200,.16),rgba(46,230,200,.02));
  box-shadow:inset 2px 0 0 var(--l)}
.cand.on .ci{color:var(--l)} .cand.on .ct{color:#fff} .cand.on .cp{color:#79b7ac}
.page{margin-left:auto;align-self:center;padding:0 4px;font-size:9.5px;color:var(--mid);
  letter-spacing:.1em}
.screen.nocand .crow{display:none}

/* ---------- 底栏 ---------- */
.bottom{height:26px;flex:0 0 26px;display:flex;align-items:center;gap:16px;padding:0 14px;
  border-top:1px solid var(--rule);background:rgba(9,9,16,.9);font-size:10px;
  letter-spacing:.06em;color:var(--faint)}
.bottom b{font-weight:400;color:var(--faint);letter-spacing:.16em;margin-right:6px}
.bottom i{font-style:normal;color:var(--mid)}
.bottom .layer i{color:var(--l)} .bottom .lang i.zh{color:var(--num)}
.bottom .spacer{flex:1}
.bottom .mods i.on{color:var(--r)}
</style>
</head>
