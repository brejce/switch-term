<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>V2 · INSTRUMENT 仪表 — switch-ime-term 重设计</title>
<link rel="stylesheet" href="mock.css">
<style>
/* ============================================================
   V2 INSTRUMENT · 深色仪表 / 键帽立体感 / 刻度与编号
   颜色只给"哪只手"和状态：左青、右橙、修饰键琥珀
   ============================================================ */
:root{
  --bg:#0d1013; --panel:#12161a; --term:#08090b;
  --ink:#dfe5ec; --mid:#8a95a2; --faint:#4b5560; --rule:#222a32;
  --acc:#37e2c2; --accR:#ff7a5c; --amber:#e9b949;
}
body{background:#05070a;color:var(--ink)}
.screen{background:var(--bg)}

/* ---------- 顶栏 ---------- */
.top{height:32px;flex:0 0 32px;display:flex;align-items:stretch;background:#0a0d10;
  border-bottom:1px solid var(--rule);font-size:11px;letter-spacing:.08em}
.brand{display:flex;align-items:center;padding:0 16px;color:var(--mid);letter-spacing:.2em}
.brand b{color:var(--ink);font-weight:400}
.tabs{display:flex;align-items:stretch;border-left:1px solid var(--rule)}
.tab{display:flex;align-items:center;padding:0 13px;font-size:10.5px;color:var(--mid);
  border-right:1px solid var(--rule);cursor:pointer;max-width:126px;white-space:nowrap;
  overflow:hidden;position:relative}
.tab.on{color:var(--ink);background:#111820;box-shadow:inset 0 -2px 0 var(--acc)}
.tab.plus{color:var(--faint);padding:0 11px}
.spacer{flex:1}
.stat{display:flex;align-items:center;gap:7px;padding:0 14px;border-left:1px solid var(--rule);
  color:var(--mid);font-size:10.5px;font-variant-numeric:tabular-nums}
.stat.clock{color:var(--ink)}
.stat .led{width:6px;height:6px;background:var(--acc);box-shadow:0 0 6px var(--acc)}

/* ---------- 三分区 ---------- */
.main{flex:1;display:flex;min-height:0}
.panel{width:220px;flex:0 0 220px;display:flex;flex-direction:column;background:var(--panel);
  position:relative}
.panel[data-side="left"]{border-right:1px solid var(--rule)}
.panel[data-side="right"]{border-left:1px solid var(--rule)}
/* 内缘刻度尺：仪器感，同时也是"面板边界" */
.panel::before{content:"";position:absolute;top:0;bottom:0;width:6px;opacity:.5;
  background-image:repeating-linear-gradient(180deg,var(--faint) 0 1px,transparent 1px 14px)}
.panel[data-side="left"]::before{right:0}
.panel[data-side="right"]::before{left:0}
/* 活跃侧：内缘一条强调线 */
.panel.active::after{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--acc)}
.panel[data-side="right"].active::after{background:var(--accR)}
.panel[data-side="left"].active::after{right:0}
.panel[data-side="right"].active::after{left:0}

/* 面板头：编号 + 名称 + 状态 */
.phead{display:flex;align-items:center;gap:8px;padding:9px 12px 0;font-size:9px;
  letter-spacing:.18em;color:var(--mid);text-transform:uppercase}
.phead .idx{color:var(--acc)}
.panel[data-side="right"] .phead .idx{color:var(--accR)}
.phead .name{color:var(--ink);letter-spacing:.16em}
.phead .meta{margin-left:auto;color:var(--faint);letter-spacing:.1em}
.phead .arm{display:none;margin-left:auto;color:var(--acc);letter-spacing:.16em;font-size:8.5px}
.panel.active .phead .arm{display:inline}
.panel.active .phead .meta{display:none}
.panel[data-side="right"].active .phead .arm{color:var(--accR)}

/* 肩键：键名 + 动作 */
.shoulders{display:flex;gap:6px;padding:8px 12px 0}
.sh{display:flex;align-items:center;gap:5px;padding:3px 7px;background:#0e1317;
  border:1px solid #202932;border-radius:3px;color:var(--mid);font:inherit;font-size:10.5px;
  cursor:pointer;letter-spacing:.02em}
.sh b{font-weight:400;color:var(--acc);letter-spacing:.06em}
.panel[data-side="right"] .sh b{color:var(--accR)}
.sh:active{background:#16202a}
.panel.active .sh:first-child{border-color:var(--acc);color:var(--ink)}
.panel[data-side="right"].active .sh:first-child{border-color:var(--accR)}

/* 键窗 */
.pad{display:grid;grid-template-columns:repeat(3,var(--k,64px));grid-auto-rows:var(--k,64px);
  column-gap:12px;row-gap:18px;justify-content:center;margin:38px auto 0;flex:0 0 auto}
.key{position:relative;width:var(--k,64px);height:var(--k,64px);display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:0;cursor:pointer;
  background:linear-gradient(180deg,#1a2027,#151b21);border:1px solid #2b353f;border-radius:4px;
  color:var(--ink);font:700 33px/1 'Maple Mono NF CN','JetBrains Mono',monospace;
  opacity:calc(.15 + .85*var(--fade,1));transform:scale(var(--shrink,1));
  transition:opacity .12s linear,transform .14s ease-out,border-color .1s,background .1s;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 2px 0 rgba(0,0,0,.35)}
.key .s{font:400 16px/1 'Maple Mono NF CN','JetBrains Mono',monospace;color:#6f7b88;margin-top:1px}
.key.snap{background:linear-gradient(180deg,#f4f8fc,#dde5ee);border-color:#f4f8fc;color:#0b0f13;
  box-shadow:inset 0 -3px 0 var(--acc), 0 2px 0 rgba(0,0,0,.4)}
.panel[data-side="right"] .key.snap{box-shadow:inset 0 -3px 0 var(--accR), 0 2px 0 rgba(0,0,0,.4)}
.key.snap .s{color:#6a7683}
.key.hover{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.panel[data-side="right"] .key.hover{border-color:var(--accR);box-shadow:inset 0 0 0 1px var(--accR)}
.key:active{border-color:var(--ink)}
.screen.nograb .key{opacity:calc(.5 + .5*var(--fade,1))}

/* 按钮簇：小键帽 */
.cluster{margin-top:auto;border-top:1px solid var(--rule);padding:14px 12px 0}
.ptitle{font-size:9px;letter-spacing:.2em;color:var(--faint);margin-bottom:8px;
  display:flex;align-items:center;gap:8px}
.ptitle::after{content:"";flex:1;height:1px;background:var(--rule)}
.dpad,.abxy{display:grid;grid-template-columns:repeat(3,40px);grid-auto-rows:28px;
  gap:3px;justify-content:center;font-size:10px;color:var(--mid)}
.dpad button,.abxy button{background:#0e1317;border:1px solid #202932;border-radius:3px;
  font:inherit;font-size:10px;color:inherit;cursor:pointer;padding:0;display:grid;place-items:center}
.dpad button.on{background:var(--amber);border-color:var(--amber);color:#151004}
.abxy{font-size:16px;font-weight:700;grid-auto-rows:28px}
.abxy button{font-size:14px;font-weight:700}
.abxy .a{color:var(--acc)} .abxy .b{color:var(--accR)}
.abxy .x{color:#68a6e0} .abxy .y{color:var(--amber)}
.hints{margin-top:14px;padding:0 12px 14px;display:flex;flex-direction:column;gap:3px;
  font-size:10px;color:var(--faint);line-height:1.5;letter-spacing:.02em}
.hints b{font-weight:400;color:var(--mid);display:inline-block;min-width:22px}
.screen.shifted [data-act="shift"],.screen.ctrled [data-act="ctrl"],.screen.alted [data-act="alt"]{
  color:var(--amber);border-color:#4a3d1c}

/* ---------- 终端 ---------- */
.term{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--term);
  padding:12px 16px 0;border-left:1px solid var(--rule);border-right:1px solid var(--rule)}
.lines{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-start;
  font-size:12.5px;line-height:1.72;color:var(--mid);white-space:pre;overflow:hidden}
.lines .who{color:var(--acc)} .lines .pth{color:#6f9fd8} .lines .sig{color:var(--faint)}
.lines .cmd{color:var(--ink)}
.composer{border-top:1px solid var(--rule);padding:6px 0 8px}
.inrow{font-size:12.5px;line-height:1.72;white-space:pre;display:flex;flex-wrap:wrap;
  align-items:baseline;color:var(--ink)}
.cmp{color:var(--acc);box-shadow:inset 0 -1px 0 var(--acc)}
.caret{display:inline-block;width:7px;height:15px;background:var(--acc);margin:0 1px;
  transform:translateY(2px);animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.crow{display:flex;align-items:stretch;min-height:24px;font-size:12.5px;margin-top:1px}
.cands{display:flex;flex-wrap:wrap;align-items:stretch}
.cand{display:flex;align-items:baseline;gap:6px;padding:3px 10px 3px 0;cursor:pointer;
  border-right:1px solid var(--rule);margin-right:10px}
.cand:last-child{border-right:0}
.ci{font-size:9px;color:var(--faint);letter-spacing:.04em}
.ci::before{content:"["} .ci::after{content:"]"}
.ct{color:var(--ink)}
.cp{font-size:10px;color:var(--faint);font-style:italic}
.cand.on{background:var(--acc);color:#062018;padding-left:8px;padding-right:8px;margin-right:10px}
.cand.on .ct{color:#062018} .cand.on .ci{color:#0a3b30} .cand.on .cp{color:#0a3b30;font-style:normal}
.page{margin-left:auto;align-self:center;padding:2px 8px;border:1px solid var(--rule);
  font-size:9.5px;color:var(--mid);letter-spacing:.12em}
.screen.nocand .crow{display:none}

/* ---------- 底栏 ---------- */
.bottom{height:26px;flex:0 0 26px;display:flex;align-items:stretch;background:#0a0d10;
  border-top:1px solid var(--rule);font-size:10px;letter-spacing:.08em;color:var(--faint)}
.field{display:flex;align-items:center;gap:7px;padding:0 13px;border-right:1px solid var(--rule)}
.field b{font-weight:400;color:var(--faint);letter-spacing:.14em}
.field i{font-style:normal;color:var(--ink)}
.field i.zh{color:var(--amber)}
.field .tick{width:5px;height:5px;background:var(--acc)}
.bottom .spacer{flex:1}
.bottom .mods b{color:var(--mid)}
.bottom .mods i.on{color:var(--amber)}
</style>
</head>
