<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3C424C"/>
      <stop offset="0.45" stop-color="#2C313A"/>
      <stop offset="1" stop-color="#1C2027"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#33D4EC"/>
      <stop offset="0.4" stop-color="#11A6C6"/>
      <stop offset="1" stop-color="#086C8A"/>
    </linearGradient>
    <linearGradient id="blueDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E9DBB"/>
      <stop offset="1" stop-color="#06566E"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6652"/>
      <stop offset="0.4" stop-color="#E53A2B"/>
      <stop offset="1" stop-color="#9E180F"/>
    </linearGradient>
    <linearGradient id="redDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C42A1D"/>
      <stop offset="1" stop-color="#7A0E07"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23272F"/>
      <stop offset="0.6" stop-color="#161A20"/>
      <stop offset="1" stop-color="#0C0F13"/>
    </linearGradient>
    <radialGradient id="stick" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#4C535F"/>
      <stop offset="0.55" stop-color="#22262D"/>
      <stop offset="1" stop-color="#0A0C10"/>
    </radialGradient>
    <radialGradient id="btn" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#3A404A"/>
      <stop offset="0.7" stop-color="#1D2128"/>
      <stop offset="1" stop-color="#101318"/>
    </radialGradient>
    <filter id="blur25" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="blur6" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <mask id="screenhole">
      <rect x="0" y="0" width="1920" height="1080" fill="#fff"/>
      <rect x="360" y="190" width="1200" height="675" rx="6" fill="#000"/>
    </mask>
  </defs>

  <!-- 落地阴影 -->
  <ellipse cx="960" cy="952" rx="790" ry="46" fill="#000000" opacity="0.55" filter="url(#blur25)"/>

  <g mask="url(#screenhole)">
    <!-- 机身 -->
    <rect x="80" y="130" width="1760" height="795" rx="40" fill="url(#body)"/>
    <rect x="80" y="130" width="1760" height="795" rx="40" fill="none" stroke="#4E5561" stroke-width="1.5"/>
    <rect x="79" y="129" width="1762" height="797" rx="41" fill="none" stroke="#8C97A8" stroke-width="1.2" opacity="0.28"/>
    <!-- 屏前面板 -->
    <rect x="334" y="136" width="1252" height="783" rx="26" fill="url(#bezel)"/>
    <!-- 主板中框高光 -->
    <rect x="334" y="136" width="1252" height="3" rx="1.5" fill="#5A626F" opacity="0.35"/>
    <!-- 导轨 -->
    <rect x="327" y="140" width="5" height="775" fill="#05070A" opacity="0.85"/>
    <rect x="1588" y="140" width="5" height="775" fill="#05070A" opacity="0.85"/>

    <!-- 左 Joy-Con -->
    <path d="M 120 130 H 320 Q 332 130 332 142 V 913 Q 332 925 320 925 H 120 Q 80 925 80 885 V 170 Q 80 130 120 130 Z" fill="url(#blue)"/>
    <path d="M 120 130 H 320 Q 332 130 332 142 V 913 Q 332 925 320 925 H 120 Q 80 925 80 885 V 170 Q 80 130 120 130 Z" fill="none" stroke="#7FE7F6" stroke-width="1.2" opacity="0.5"/>
    <path d="M 126 136 H 318 Q 326 136 326 144 V 909 Q 326 917 318 917 H 122 Q 88 917 88 883 V 174 Q 88 136 126 136 Z" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.10"/>
    <!-- 左摇杆凹槽 -->
    <circle cx="206" cy="350" r="58" fill="#05070A" opacity="0.55"/>
    <circle cx="206" cy="350" r="56" fill="#0B0E12" opacity="0.5"/>
    <circle cx="206" cy="350" r="50" fill="url(#stick)" stroke="#4A515D" stroke-width="1.5"/>
    <ellipse cx="192" cy="334" rx="22" ry="16" fill="#FFFFFF" opacity="0.10"/>
    <!-- 左十字键 -->
    <rect x="184" y="524" width="44" height="44" rx="11" fill="url(#btn)" stroke="#3E444F" stroke-width="1"/>
    <rect x="184" y="612" width="44" height="44" rx="11" fill="url(#btn)" stroke="#3E444F" stroke-width="1"/>
    <rect x="140" y="568" width="44" height="44" rx="11" fill="url(#btn)" stroke="#3E444F" stroke-width="1"/>
    <rect x="228" y="568" width="44" height="44" rx="11" fill="url(#btn)" stroke="#3E444F" stroke-width="1"/>
    <!-- 减号 -->
    <rect x="286" y="222" width="26" height="8" rx="4" fill="#0E141A" opacity="0.85"/>
    <!-- L / ZL -->
    <rect x="108" y="94" width="120" height="42" rx="19" fill="url(#blueDark)" stroke="#0B2B36" stroke-width="1"/>
    <rect x="102" y="118" width="130" height="46" rx="21" fill="url(#blue)" stroke="#8DEEFB" stroke-width="1.2" opacity="0.95"/>

    <!-- 右 Joy-Con -->
    <path d="M 1800 130 H 1600 Q 1588 130 1588 142 V 913 Q 1588 925 1600 925 H 1800 Q 1840 925 1840 885 V 170 Q 1840 130 1800 130 Z" fill="url(#red)"/>
    <path d="M 1800 130 H 1600 Q 1588 130 1588 142 V 913 Q 1588 925 1600 925 H 1800 Q 1840 925 1840 885 V 170 Q 1840 130 1800 130 Z" fill="none" stroke="#FFA79C" stroke-width="1.2" opacity="0.45"/>
    <path d="M 1794 136 H 1602 Q 1594 136 1594 144 V 909 Q 1594 917 1602 917 H 1798 Q 1832 917 1832 883 V 174 Q 1832 136 1794 136 Z" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.10"/>
    <!-- ABXY -->
    <g fill="url(#btn)" stroke="#434955" stroke-width="1">
      <circle cx="1614" cy="300" r="30"/>
      <circle cx="1664" cy="350" r="30"/>
      <circle cx="1614" cy="400" r="30"/>
      <circle cx="1564" cy="350" r="30"/>
    </g>
    <g fill="#EDF0F5" font-family="Noto Sans" font-size="24" font-weight="bold" text-anchor="middle">
      <text x="1614" y="309">X</text>
      <text x="1664" y="359">A</text>
      <text x="1614" y="409">B</text>
      <text x="1564" y="359">Y</text>
    </g>
    <!-- 右摇杆 -->
    <circle cx="1596" cy="590" r="58" fill="#05070A" opacity="0.5"/>
    <circle cx="1596" cy="590" r="50" fill="url(#stick)" stroke="#4A515D" stroke-width="1.5"/>
    <ellipse cx="1582" cy="574" rx="22" ry="16" fill="#FFFFFF" opacity="0.10"/>
    <!-- 加号 -->
    <rect x="1598" y="224" width="8" height="26" rx="4" fill="#0E141A" opacity="0.85"/>
    <rect x="1589" y="233" width="26" height="8" rx="4" fill="#0E141A" opacity="0.85"/>
    <!-- Home / Capture -->
    <circle cx="1670" cy="798" r="27" fill="#12161C" stroke="#3E444F" stroke-width="1"/>
    <path d="M 1670 786 l 11 10 h -4 v 10 h -14 v -10 h -4 z" fill="#DDE2EA" opacity="0.9"/>
    <rect x="1502" y="786" width="24" height="24" rx="7" fill="#12161C" stroke="#3E444F" stroke-width="1"/>
    <!-- R / ZR -->
    <rect x="1694" y="94" width="120" height="42" rx="19" fill="url(#redDark)" stroke="#3A0703" stroke-width="1"/>
    <rect x="1688" y="118" width="130" height="46" rx="21" fill="url(#red)" stroke="#FFB3A9" stroke-width="1.2" opacity="0.95"/>
  </g>

  <!-- 屏幕内阴影 -->
  <rect x="356" y="186" width="1208" height="683" rx="10" fill="none" stroke="#000000" stroke-width="14" opacity="0.55" filter="url(#blur6)"/>
  <!-- 屏幕玻璃边缘（压在挖孔四周） -->
  <rect x="357" y="187" width="1206" height="681" rx="9" fill="none" stroke="#04060A" stroke-width="6"/>
  <rect x="360" y="190" width="1200" height="675" rx="6" fill="none" stroke="#2A2F38" stroke-width="1" opacity="0.6"/>
  <!-- 机身底部散热/扬声器小孔 -->
  <g fill="#0A0C10" opacity="0.8">
    <circle cx="470" cy="902" r="3"/><circle cx="488" cy="902" r="3"/><circle cx="506" cy="902" r="3"/><circle cx="524" cy="902" r="3"/>
    <circle cx="1396" cy="902" r="3"/><circle cx="1414" cy="902" r="3"/><circle cx="1432" cy="902" r="3"/><circle cx="1450" cy="902" r="3"/>
  </g>
</svg>
